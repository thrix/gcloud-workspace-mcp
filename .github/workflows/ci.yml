name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # pytest runs across the Python matrix below. The gitleaks hook only reads
      # staged changes, so the next step scans the full history instead.
      - run: SKIP=pytest,gitleaks uv run pre-commit run --all-files --show-diff-on-failure
      - name: gitleaks (full history)
        run: podman run --rm -v "$PWD:/repo:ro,z" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --verbose

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest -v --cov
