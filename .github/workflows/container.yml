name: Container

# Pull requests build and test the image. Pushes to main and version tags also
# publish it to ghcr.io with a build provenance attestation.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      # main -> :main, v1.2.3 -> :1.2.3 :1.2 :latest, plus :sha-<short> on each push.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=gcloud-workspace-mcp
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034  # v3.1.0
        with:
          image: gcloud-workspace-mcp
          tags: ${{ steps.meta.outputs.tag-names }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./Containerfile
          platforms: linux/amd64,linux/arm64
          oci: true

      - name: gcloud runs inside the image
        run: |
          for arch in amd64 arm64; do
            podman run --rm --platform "linux/$arch" --entrypoint gcloud \
              "${{ steps.build.outputs.image-with-tag }}" version
          done

      - name: server lists its tools over stdio
        run: |
          init='{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}'
          for arch in amd64 arm64; do
            # The server stops on stdin EOF, possibly before it answers
            # tools/list, so stdin stays open for a while (longer under qemu).
            {
              printf '%s\n' \
                "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":$init}" \
                '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
                '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
              sleep 30
            } | timeout 120 podman run -i --rm --platform "linux/$arch" \
                  "${{ steps.build.outputs.image-with-tag }}" \
              | tee /dev/stderr | grep -q '"drive_search"'
          done

      - id: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-to-registry logs in through podman only. The attestation step reads
      # the Docker config, so it needs a login of its own.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
