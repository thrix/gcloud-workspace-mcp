name: Container

# Pull requests build and test the image. Pushes to main and version tags also
# publish it to ghcr.io with a build provenance attestation.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # main -> :main, v1.2.3 -> :1.2.3 :1.2 :latest, plus :sha-<short> on each push.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=gcloud-workspace-mcp
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: redhat-actions/buildah-build@v3
        with:
          image: gcloud-workspace-mcp
          tags: ${{ steps.meta.outputs.tag-names }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./Containerfile
          platforms: linux/amd64,linux/arm64
          oci: true

      - name: gcloud runs inside the image
        run: |
          for arch in amd64 arm64; do
            podman run --rm --platform "linux/$arch" --entrypoint gcloud \
              "${{ steps.build.outputs.image-with-tag }}" version
          done

      - name: server lists its tools over stdio
        run: |
          init='{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}'
          for arch in amd64 arm64; do
            printf '%s\n' \
              "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":$init}" \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
              | timeout 120 podman run -i --rm --platform "linux/$arch" \
                  "${{ steps.build.outputs.image-with-tag }}" \
              | tee /dev/stderr | grep -q '"drive_search"'
          done

      - id: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
